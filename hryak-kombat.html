<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Хряк Комбат</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#fff;--sf:#f4f5f9;--ink:#1d2130;--mut:#7b8296;--ac:#ff5f86;--acs:#ffe6ed;--ln:#eceef4;--sh:0 8px 24px rgba(40,50,100,.08)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141722;--sf:#1e2230;--ink:#f1f3fa;--mut:#8f97b0;--ac:#ff7f9c;--acs:#ff7f9c26;--ln:#2a2f42;--sh:0 8px 24px rgba(0,0,0,.3)}}
:root[data-theme="dark"]{--bg:#141722;--sf:#1e2230;--ink:#f1f3fa;--mut:#8f97b0;--ac:#ff7f9c;--acs:#ff7f9c26;--ln:#2a2f42;--sh:0 8px 24px rgba(0,0,0,.3)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Nunito","Trebuchet MS",system-ui,sans-serif;user-select:none;-webkit-user-select:none;transition:background .3s,color .3s;overflow-x:hidden}
svg{width:20px;height:20px;display:block}
.app{max-width:480px;margin:0 auto;padding:12px 18px 110px}
header{display:flex;justify-content:space-between;align-items:center;gap:8px}
.nm{display:flex;align-items:center;gap:4px;min-width:0}
#name{font:inherit;font-weight:900;font-size:22px;width:172px;background:none;border:0;border-bottom:2px solid transparent;color:var(--ink);padding:2px 0;outline:0;user-select:text;-webkit-user-select:text}
#name:focus{border-color:var(--ac)}
.acts{display:flex;gap:8px}
.ib{width:40px;height:40px;border-radius:14px;border:0;background:var(--sf);color:var(--ink);display:grid;place-items:center;cursor:pointer;transition:transform .15s}
.ib:active{transform:scale(.88) rotate(-6deg)}
.rank{display:flex;justify-content:space-between;font-size:13px;font-weight:800;color:var(--mut);margin:14px 2px 6px}
#rk{color:var(--ink)}
.bar{height:8px;background:var(--sf);border-radius:8px;overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:8px;background:linear-gradient(90deg,#ff9bb3,var(--ac));transition:width .3s}
.panel{display:none}
.panel.on{display:block;animation:in .35s cubic-bezier(.2,.8,.3,1)}
@keyframes in{from{opacity:0;transform:translateY(14px)}}
.mass{text-align:center;margin-top:16px}
#mass{display:inline-block;font-size:48px;font-weight:900;letter-spacing:-1px;font-variant-numeric:tabular-nums}
.chips{display:flex;justify-content:center;gap:8px;margin-top:4px}
.chip{display:flex;align-items:center;gap:6px;background:var(--sf);border-radius:20px;padding:6px 12px;font-size:13px;font-weight:800}
.chip svg{width:16px;height:16px;color:var(--ac)}
.stage{position:relative;display:grid;place-items:center;margin:16px 0 10px}
.stage::before{content:"";grid-area:1/1;width:min(90vw,390px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,var(--acs),transparent 68%);animation:pulse 3.4s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.08);opacity:.7}}
.pigwrap{grid-area:1/1;width:min(70vw,290px);transform:scale(var(--fat,1));transition:transform .7s cubic-bezier(.3,1.6,.5,1)}
.ring{aspect-ratio:1;border-radius:50%;padding:7px;background:linear-gradient(145deg,#fff,var(--acs));box-shadow:0 18px 40px rgba(255,95,134,.28),inset 0 0 0 1px var(--ln);cursor:pointer;touch-action:manipulation}
.ring img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block;pointer-events:none;-webkit-user-drag:none;animation:br 3.4s ease-in-out infinite}
@keyframes br{50%{transform:scale(1.025)}}
.rip{grid-area:1/1;width:min(70vw,290px);aspect-ratio:1;border-radius:50%;border:3px solid var(--ac);pointer-events:none}
.en{display:flex;align-items:center;gap:10px;background:var(--sf);border-radius:18px;padding:12px 14px;font-weight:800;font-size:13px}
.en svg{width:18px;height:18px;color:#f5a300}
.en .bar{flex:1;height:10px;background:var(--ln)}
.en .bar i{background:linear-gradient(90deg,#ffc94d,#ff9a3d)}
h2{margin:18px 0 2px;font-size:24px;font-weight:900}
.sub{margin:0 0 6px;color:var(--mut);font-weight:700;font-size:14px}
.dish{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--ln);border-radius:20px;margin-top:10px;box-shadow:var(--sh)}
.tile{width:54px;height:54px;border-radius:16px;background:var(--acs);display:grid;place-items:center;font-size:30px}
.tx{flex:1;min-width:0}
.tx b{display:block;font-size:16px}
.tx small{display:block;color:var(--mut);font-size:12px;font-weight:700}
.tx em{font-style:normal;font-size:11px;font-weight:800;color:var(--ac)}
.buy{display:flex;align-items:center;gap:6px;border:0;border-radius:14px;padding:10px 12px;background:var(--ac);color:#fff;font:inherit;font-weight:900;font-size:13px;cursor:pointer;transition:transform .12s}
.buy svg{width:16px;height:16px}
.buy:active{transform:scale(.92)}
.buy:disabled{background:var(--sf);color:var(--mut);cursor:default;transform:none}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:8px;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--ln)}
.tb{flex:1;max-width:220px;display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;color:var(--mut);font:inherit;font-weight:800;font-size:12px;padding:8px;border-radius:16px;cursor:pointer;transition:background .25s,color .25s}
.tb svg{width:24px;height:24px;transition:transform .3s cubic-bezier(.3,1.8,.5,1)}
.tb.on{background:var(--acs);color:var(--ac)}
.tb.on svg{transform:translateY(-2px) scale(1.15)}
.pt,.pop{position:fixed;z-index:30;pointer-events:none}
.pt{font-size:16px}
.pop{font-weight:900;font-size:24px;color:var(--ac);text-shadow:0 2px 8px rgba(0,0,0,.25)}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:14px;font-weight:800;font-size:13px;opacity:0;transition:.25s;pointer-events:none;z-index:40;max-width:86vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){.ring img,.stage::before{animation:none}.panel.on{animation:none}}
</style>
</head>

    <div class="acts"><button class="ib" id="snd" aria-label="Звук"></button><button class="ib" id="thm" aria-label="Тема"></button></div>

 clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'};
const ic=n=>'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+I[n]+'</svg>';
const fill=()=>document.querySelectorAll("[data-i]").forEach(e=>e.innerHTML=ic(e.dataset.i));

const S={m:0,t:0,lv:[0,0,0,0,0],en:1000,name:"Хрюндель",snd:1,th:"light",last:Date.now()};
const tapV=()=>1+S.lv[0]+5*S.lv[4], maxEn=()=>1000+300*S.lv[2], regen=()=>3+S.lv[1], hr=()=>600*S.lv[3];
const cost=i=>Math.round(DISH[i].b*Math.pow(DISH[i].f,S.lv[i]));
const fmt=g=>{g=Math.floor(g);return g<1e3?g+" г":g<1e6?(g/1e3).toFixed(2)+" кг":(g/1e6).toFixed(2)+" т"};
let offline=0;
try{const o=JSON.parse(localStorage.getItem(KEY)||"null");if(o){Object.assign(S,o);
  const away=Math.min((Date.now()-S.last)/1000,10800);
  if(hr()>0&&away>30){offline=Math.floor(hr()/3600*away);S.m+=offline;S.t+=offline}
  S.en=Math.min(maxEn(),S.en+regen()*away)}}catch(e){}
const save=()=>{S.last=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};

/* sound */
let AC=null;
function ctx(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==="suspended")AC.resume();return AC}
function tone(f1,f2,d,type,vol,delay){const a=ctx();if(!a||!S.snd)return;const t=a.currentTime+(delay||0),o=a.createOscillator(),g=a.createGain(),fl=a.createBiquadFilter();
 fl.type="lowpass";fl.frequency.value=1500;o.type=type;o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(f2,t+d);
 g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+d);
 o.connect(fl);fl.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.02)}
function noise(d,vol,fr,q,delay){const a=ctx();if(!a||!S.snd)return;const t=a.currentTime+(delay||0),n=Math.floor(a.sampleRate*d),b=a.createBuffer(1,n,a.sampleRate),c=b.getChannelData(0);
 for(let i=0;i<n;i++)c[i]=Math.random()*2-1;
 const s=a.createBufferSource(),fl=a.createBiquadFilter(),g=a.createGain();s.buffer=b;fl.type="bandpass";fl.frequency.value=fr;fl.Q.value=q;
 g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(fl);fl.connect(g);g.connect(a.destination);s.start(t)}
/* "хрю": короткий сап (хр) + низький хрипкий голос (ю) */
function oink(){const a=ctx();if(!a||!S.snd)return;const now=performance.now();if(now-(oink.l||0)<90)return;oink.l=now;
 const p=.88+Math.random()*.28,t=a.currentTime;
 noise(.09,.9,1500,.7);
 const o=a.createOscillator(),l=a.createOscillator(),lg=a.createGain(),f=a.createBiquadFilter(),g=a.createGain();
 o.type="sawtooth";o.frequency.setValueAtTime(200*p,t+.05);o.frequency.exponentialRampToValueAtTime(105*p,t+.24);
 l.frequency.value=34;lg.gain.value=16;l.connect(lg);lg.connect(o.frequency);
 f.type="bandpass";f.frequency.setValueAtTime(760,t+.05);f.frequency.linearRampToValueAtTime(400,t+.24);f.Q.value=1.6;
 g.gain.setValueAtTime(.0001,t+.04);g.gain.exponentialRampToValueAtTime(1.3,t+.09);g.gain.exponentialRampToValueAtTime(.0001,t+.26);
 o.connect(f);f.connect(g);g.connect(a.destination);o.start(t+.04);l.start(t+.04);o.stop(t+.28);l.stop(t+.28)}
const munch=()=>[0,.09,.18].forEach(d=>tone(210,90,.07,"square",.08,d));
const chime=()=>[523,659,784,1047].forEach((f,i)=>tone(f,f,.2,"triangle",.1,i*.09));

/* fx */
function toast(t){const e=$("toast");e.textContent=t;e.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("on"),2400)}
function burst(x,y,arr,n,dist){for(let k=0;k<n;k++){const s=document.createElement("span");s.className="pt";s.textContent=arr[k%arr.length];s.style.left=x+"px";s.style.top=y+"px";document.body.appendChild(s);
 const a=Math.random()*6.283,r=dist*(.5+Math.random()*.7);
 s.animate([{transform:"translate(-50%,-50%) scale(.4)",opacity:1},{transform:`translate(calc(-50% + ${Math.cos(a)*r}px),calc(-50% + ${Math.sin(a)*r-24}px)) scale(1.2)`,opacity:0}],{duration:600+Math.random()*300,easing:"cubic-bezier(.2,.7,.3,1)"}).onfinish=()=>s.remove()}}
function pop(x,y,t){const p=document.createElement("div");p.className="pop";p.textContent=t;p.style.left=x-20+"px";p.style.top=y-30+"px";document.body.appendChild(p);
 const dx=(Math.random()-.5)*50;p.animate([{transform:"translate(0,0) scale(.6)",opacity:1},{transform:`translate(${dx}px,-30px) scale(1.15)`,opacity:1,offset:.25},{transform:`translate(${dx}px,-90px) scale(1)`,opacity:0}],{duration:850,easing:"ease-out"}).onfinish=()=>p.remove()}

/* ui */
const pig=$("pig"),stage=$("stage");
DISH.forEach((d,i)=>{const c=document.createElement("div");c.className="dish";
 c.innerHTML=`<div class="tile" id="t${i}">${d.e}</div><div class="tx"><b>${d.n}</b><small>${d.d}</small><em id="l${i}"></em></div><button class="buy" id="b${i}"><span data-i="food"></span><span id="p${i}"></span></button>`;
 $("list").appendChild(c);$("b"+i).onclick=()=>feed(i)});
let lastLi=0;
function upd(){
 $("mass").textContent=fmt(S.m);
 $("cTap").textContent="+"+tapV()+" г / тап";$("cHr").textContent="+"+hr()+" г / год";
 let li=0;RANKS.forEach((r,i)=>{if(S.t>=r[1])li=i});const nx=RANKS[li+1];
 $("rk").textContent=RANKS[li][0]+" · "+(li+1)+"/"+RANKS.length;
 $("rkN").textContent=nx?"ще "+fmt(nx[1]-S.t):"максимум";
 $("lvBar").style.width=(nx?(S.t-RANKS[li][1])/(nx[1]-RANKS[li][1])*100:100)+"%";
 $("enBar").style.width=S.en/maxEn()*100+"%";$("enTx").textContent=Math.floor(S.en)+" / "+maxEn();
 DISH.forEach((d,i)=>{$("l"+i).textContent="Рівень "+S.lv[i];$("p"+i).textContent=fmt(cost(i));$("b"+i).disabled=S.m<cost(i)});
 stage.style.setProperty("--fat",1+Math.min(.14,S.lv.reduce((a,b)=>a+b,0)*.008));
 if(li>lastLi){lastLi=li;chime();toast("Новий ранг: "+RANKS[li][0]+"!");burst(innerWidth/2,innerHeight/2,["🎉","✨","💗","⭐"],14,150)}
}
function feed(i){const c=cost(i);if(S.m<c)return;S.m-=c;S.lv[i]++;munch();
 const t=$("t"+i);t.animate([{transform:"scale(1)"},{transform:"scale(1.3) rotate(-10deg)"},{transform:"scale(.95) rotate(6deg)"},{transform:"scale(1)"}],{duration:420,easing:"ease-out"});
 const r=t.getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height/2,[DISH[i].e,"✨"],6,80);
 toast("Ням! "+S.name+" з'їв: "+DISH[i].n.toLowerCase());upd();save()}

pig.addEventListener("pointerdown",e=>{e.preventDefault();ctx();const t=tapV();
 if(S.en<t){toast("Хряк втомився — зачекай, поки відновиться енергія");return}
 S.en-=t;S.m+=t;S.t+=t;
 const r=pig.getBoundingClientRect(),dx=(e.clientX-(r.left+r.width/2))/r.width;
 pig.animate([{transform:"scale(1) rotate(0)"},{transform:`scale(1.07,.9) rotate(${dx*12}deg)`,offset:.35},{transform:"scale(.97,1.04) rotate(0)",offset:.7},{transform:"scale(1)"}],{duration:300,easing:"ease-out"});
 const rp=document.createElement("div");rp.className="rip";stage.appendChild(rp);
 rp.animate([{transform:"scale(.85)",opacity:.6},{transform:"scale(1.4)",opacity:0}],{duration:600,easing:"ease-out"}).onfinish=()=>rp.remove();
 $("mass").animate([{transform:"scale(1)"},{transform:"scale(1.06)"},{transform:"scale(1)"}],{duration:150});
 burst(e.clientX,e.clientY,["💗","✨","⭐"],3,60);pop(e.clientX,e.clientY,"+"+t+" г");oink();
 if(navigator.vibrate){try{navigator.vibrate(8)}catch(x){}}
 upd()});
pig.addEventListener("contextmenu",e=>e.preventDefault());

document.querySelectorAll(".tb").forEach(b=>b.onclick=()=>{
 document.querySelectorAll(".tb").forEach(x=>x.classList.toggle("on",x===b));
 document.querySelectorAll(".panel").forEach(p=>p.classList.toggle("on",p.id==="p-"+b.dataset.t))});

const nameEl=$("name");nameEl.value=S.name;
nameEl.addEventListener("input",()=>{S.name=nameEl.value.trim()||"Хрюндель";save()});
nameEl.addEventListener("keydown",e=>{if(e.key==="Enter")nameEl.blur()});
$("edit").onclick=()=>{nameEl.focus();nameEl.select()};
function look(){document.documentElement.dataset.theme=S.th;$("thm").innerHTML=ic(S.th==="dark"?"sun":"moon");$("snd").innerHTML=ic(S.snd?"on":"off")}
$("thm").onclick=()=>{S.th=S.th==="dark"?"light":"dark";look();save()};
$("snd").onclick=()=>{S.snd=S.snd?0:1;look();if(S.snd){ctx();oink()}save()};

setInterval(()=>{S.en=Math.min(maxEn(),S.en+regen());if(hr()>0){const g=hr()/3600;S.m+=g;S.t+=g}upd()},1000);
setInterval(save,3000);document.addEventListener("visibilitychange",save);
fill();look();
RANKS.forEach((r,i)=>{if(S.t>=r[1])lastLi=i});
upd();
if(offline)setTimeout(()=>toast("Поки тебе не було: +"+fmt(offline)),500);
})();
</script>
</body>
</html>
